name: Repo Agent
on:
  workflow_dispatch:        # still allows manual runs
  pull_request:             # triggers automatically on PR events
    types:
      - opened              # when a new PR is created
      - synchronize         # when commits are pushed to the PR branch
      - reopened            # when a closed PR is reopened
    branches:
      - main

permissions:
  issues: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install repoagent openai

      - name: Ensure .gitignore exists
        run: |
          if [ ! -f .gitignore ]; then
            echo "# Auto-created .gitignore for RepoAgent" > .gitignore
          fi

      - name: Configure and Run RepoAgent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat << 'EOF' > config.toml
          [main]
          target_repo_path = "."
          hierarchy_path = ".agent.md"
          issue_output = "pr"   # post results into PR comments

          [openai]
          api_key = "${OPENAI_API_KEY}"
          model = "gpt-4o"
          EOF

          repoagent run
