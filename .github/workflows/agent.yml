name: Repo Agent
on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install repoagent openai

      - name: Verify Prompt File Exists
        run: |
          if [ ! -f .agent.md ]; then
            echo "Error: .agent.md file not found in repository root."
            exit 1
          fi

      - name: Run RepoAgent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          repoagent run