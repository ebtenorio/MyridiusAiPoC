name: Repo Agent
on:
  workflow_dispatch:        # manual runs
  pull_request:             # PR events
    types: [opened, synchronize, reopened]
    branches: [main]
  issues:                   # Issue events
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install repoagent openai

      - name: Ensure .gitignore exists
        run: |
          if [ ! -f .gitignore ]; then
            echo "# Auto-created .gitignore for RepoAgent" > .gitignore
          fi

      - name: Configure and Run RepoAgent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > config.toml
          [main]
          target_repo_path = "."
          hierarchy_path = ".agent.md"

          [openai]
          api_key = "${OPENAI_API_KEY}"
          model = "gpt-4o"
          EOF

          repoagent run

      - name: Post RepoAgent output to PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### RepoAgent Output
            RepoAgent has refreshed documentation.  
            See generated files in `markdown_docs/`.  
            Logs are available in the Actions run.  
            Download the artifact for full prompt results.

      - name: Post RepoAgent output to Issue
        if: github.event_name == 'issues'
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### RepoAgent Output
            RepoAgent has refreshed documentation.  
            See generated files in `markdown_docs/`.  
            Logs are available in the Actions run.  
            Download the artifact for full prompt results.

      - name: Upload RepoAgent docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repoagent-docs
          path: markdown_docs
