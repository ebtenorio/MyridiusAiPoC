name: Repo Agent
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  issues: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install repoagent openai

      - name: Configure and Run RepoAgent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat << 'EOF' > config.toml
          [main]
          target_repo_path = "."
          hierarchy_path = ".agent.md"
          issue_output = "pr"      # post into PR comments
          secondary_output = "issue"  # also create/update an Issue

          [openai]
          api_key = "${OPENAI_API_KEY}"
          model = "gpt-4o"
          EOF

          repoagent run
