name: Repo Agent
on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Repo Agent
        uses: repo-agent/repo-agent@v0
        with:
          prompt-file: .agent.md  # Agent instructions
          issue-output: true     # Post outputs into Issues tab