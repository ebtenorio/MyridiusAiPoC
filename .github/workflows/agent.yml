name: Repo Agent
on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Run Agent Script
        env:
          PROMPT_FILE: ../.agent.md     # Pass file path to the environment
          ISSUE_OUTPUT: "true"
        run: |
          cd myridius-auth-demo
          npm install
          node server.js
