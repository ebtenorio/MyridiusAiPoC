name: Repo Agent
on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install repoagent openai

      - name: Run RepoAgent with prompt file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "
          import sys
          from repo_agent.main import cli

          # Pass instructions directly via sys.argv to avoid CLI parsing errors
          with open('.agent.md', 'r') as f:
              prompt = f.read()

          print('Successfully loaded .agent.md content')
          "
          repoagent run --target-repo-path .