name: Repo Agent
on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install repoagent openai

      - name: Run Agent with .agent.md
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "
          import os
          from repo_agent.main import cli

          with open('.agent.md', 'r') as f:
              instructions = f.read()

          print('Running agent with instructions loaded from .agent.md...')
          "
          repoagent --target-repo-path .