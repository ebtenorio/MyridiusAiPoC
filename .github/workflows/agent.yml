name: Repo Agent
on:
  workflow_dispatch:        # manual runs
  pull_request:             # PR events
    types: [opened, synchronize, reopened]
    branches: [main]
  issues:                   # Issue events
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (PyPI release)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade repoagent openai

      - name: Check RepoAgent version
        run: pip show repoagent

      - name: Debug RepoAgent CLI
        run: repoagent run --help

      - name: Run RepoAgent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v0.2.0 doesn’t support --config or file writing
          # It will read .agent.md automatically and post comments
          repoagent run

      - name: Post RepoAgent output to PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### RepoAgent Output
            RepoAgent has processed `.agent.md` and posted structured comments.  
            See the PR conversation for details.

      - name: Post RepoAgent output to Issue
        if: github.event_name == 'issues'
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### RepoAgent Output
            RepoAgent has processed `.agent.md` and posted structured comments.  
            See the Issue conversation for details.
